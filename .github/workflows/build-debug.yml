name: Build BCU Editor (debug APK)

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with the common submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17 (needed by Android Gradle Plugin 8.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The repo expects a password in local.properties (git-ignored upstream).
      - name: Create local.properties
        run: echo "password=editor" > local.properties

      # google-services.json is git-ignored upstream, but the Firebase plugins
      # refuse to build without one. A placeholder is enough to compile.
      - name: Create placeholder google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "bcu-editor-ci",
              "storage_bucket": "bcu-editor-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "com.mandarin.bcu" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "com.mandarin.bcu.editor" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # MainActivity reads res/raw/service_key.json (the devs' Google Drive key
      # for uploading crash logs). It's git-ignored, so add a placeholder;
      # log uploads will just fail quietly in your build.
      - name: Create placeholder service_key.json
        run: echo '{}' > app/src/main/res/raw/service_key.json

      # Upstream signs every build with a keystore at a path on the dev's Mac.
      # Use app/ci-keystore.jks instead: reuse it if you've committed it,
      # otherwise generate one (and upload it below so you can commit it).
      - name: Prepare signing keystore
        run: |
          sed -i "s#file('/Users/roguerouge/Downloads/BCU_Android/keystore.jks')#file('ci-keystore.jks')#" app/build.gradle
          if [ ! -f app/ci-keystore.jks ]; then
            echo "No committed keystore found - generating a new one."
            keytool -genkeypair -keystore app/ci-keystore.jks \
              -storepass battlecatsultimate -keypass battlecatsultimate \
              -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BCU Editor CI"
            echo "NEW_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      # Give the debug build its own package name so it installs next to the
      # official BCU instead of conflicting with it.
      - name: Install side-by-side with official BCU
        run: |
          sed -i 's/^\( *\)debug {$/\1debug {\n\1    applicationIdSuffix ".editor"\n\1    signingConfig signingConfigs.release/' app/build.gradle
          sed -i 's/"com\.mandarin\.bcu\.provider"/"${applicationId}.provider"/' app/src/main/AndroidManifest.xml
          grep -rl '"com.mandarin.bcu.provider"' app/src/main/java/com | while read -r f; do
            sed -i 's/"com\.mandarin\.bcu\.provider"/com.mandarin.bcu.BuildConfig.APPLICATION_ID + ".provider"/g' "$f"
          done

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bcu-editor-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload generated keystore (commit this once!)
        if: env.NEW_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-keystore-COMMIT-TO-app-folder
          path: app/ci-keystore.jks
